name: CI

on:
  push:
    branches: [main, uat, dev]
  pull_request:
    branches: [main, uat, dev]
  workflow_call:

jobs:
  cms:
    name: CMS — Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: cd cms && npm ci
      - run: cd cms && npm run build

  frontend:
    name: Frontend — Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build

  next-home:
    name: Next.js Homepage — Typecheck, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            next-home/package-lock.json
      - run: cd frontend && npm ci
      - run: cd next-home && npm ci
      - run: cd next-home && npm run typecheck
      - run: cd next-home && npm run lint
      - run: cd next-home && npm run build
      - run: cd next-home && npm run test:ssr

  infra:
    name: Infra — Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: cd infra && npm ci
      - run: cd infra && npx tsc --noEmit
