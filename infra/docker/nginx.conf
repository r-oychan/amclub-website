upstream strapi {
    server 127.0.0.1:1337;
}

# Honor the upstream X-Forwarded-Proto header when set by a fronting load
# balancer (Azure Container Apps ingress sets it to "https" for external
# traffic, then forwards to this nginx over HTTP — so $scheme is "http"
# and overwriting with it would tell Strapi the connection is insecure,
# breaking the OAuth secure-cookie flow). Falls back to $scheme when no
# upstream header is present (e.g. local Docker testing).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /app/frontend;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded media — reverse-proxy to the Azure Blob container so assets are
    # served from THIS origin (https://<site>/uploads/...) instead of the raw
    # *.blob.core.windows.net host. The upload provider sets cdnBaseURL to the
    # site origin (STORAGE_CDN_URL) and strips the container segment, so a file
    # URL like /uploads/dining/foo.jpg maps to the blob
    # <account>.blob.core.windows.net/<container>/uploads/dining/foo.jpg.
    # ${STORAGE_ACCOUNT}/${STORAGE_CONTAINER_NAME} are templated in at startup by
    # entrypoint.sh (envsubst) — so this proxy_pass contains NO nginx variables.
    # That matters: a variable proxy_pass makes nginx do its own UDP DNS via the
    # `resolver` directive, which the Container App's DNS doesn't answer for nginx
    # → 502. With a static proxy_pass, nginx resolves the blob host at config-load
    # time via the system resolver (the same libc path Strapi uses successfully).
    # The location prefix `/uploads/` is stripped and appended to the proxy_pass
    # URI, so /uploads/dining/x.jpg → <account>/<container>/uploads/dining/x.jpg.
    # The container has public blob read, so no auth is forwarded.
    location /uploads/ {
        error_log /dev/stderr warn;
        proxy_pass https://${STORAGE_ACCOUNT}.blob.core.windows.net/${STORAGE_CONTAINER_NAME}/uploads/;
        proxy_ssl_server_name on;
        proxy_ssl_name ${STORAGE_ACCOUNT}.blob.core.windows.net;
        proxy_set_header Host ${STORAGE_ACCOUNT}.blob.core.windows.net;
        proxy_set_header Authorization "";
        proxy_hide_header x-ms-request-id;
        proxy_hide_header x-ms-version;
        proxy_hide_header x-ms-blob-type;
        proxy_hide_header x-ms-lease-status;
        proxy_hide_header x-ms-server-encrypted;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Strapi API, admin panel, and internal endpoints
    # `strapi-plugin-sso` is included so the OAuth callback URL
    # (/strapi-plugin-sso/azuread/callback) routes to Strapi, not the SPA.
    location ~ ^/(api|admin|_health|content-manager|content-type-builder|upload|users-permissions|i18n|email|strapi-plugin-sso)(/|$) {
        proxy_pass http://strapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 50m;
    }

    # Frontend SPA fallback. NB: `$uri/` is intentionally omitted — with it
    # nginx treats trailing-slash URIs like /membership/ as directory
    # requests and returns 403 (no index, autoindex off) instead of falling
    # through to /index.html. Without `$uri/`, every non-asset path lands
    # on the SPA shell and React Router handles the route.
    location / {
        try_files $uri /index.html;
    }
}
